<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<title>browser drag project schematic</title>
<rect width="1200" height="620" fill="#FCFCF9"/>
<text x="56" y="73.6" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#17343B">一次输入，三层验收</text>
<text x="56" y="113.2" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#536C70">CLI → daemon → 扩展 → 原页回读；每层结果分别记录。</text>
