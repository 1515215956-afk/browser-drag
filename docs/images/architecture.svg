<text x="640" y="244.5" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#17343B">MV3 扩展</text>
<text x="640" y="282.4" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#536C70">合作状态 · 原生拖拽</text>
