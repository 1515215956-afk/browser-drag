<text x="358" y="244.5" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#17343B">本地 daemon</text>
<text x="358" y="282.4" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#536C70">52841 · 独立目录</text>
<text x="358" y="310.4" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#536C70">配套协议通信</text>
