<text x="76" y="244.5" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#17343B">决策与 CLI</text>
<text x="76" y="282.4" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#536C70">显式实例 · 当前会话</text>
<text x="76" y="310.4" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#536C70">输入请求与目标</text>
