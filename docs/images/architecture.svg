<polyline points="869,251 893,251" fill="none" stroke="#247D75" stroke-width="2" stroke-linejoin="round"/>
<polygon points="893,251 885.1017569429866,255.31482984743784 885.1017569429866,246.68517015256216" fill="#247D75"/>
