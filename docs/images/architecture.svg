<text x="922" y="244.5" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#17343B">同页回读</text>
<text x="922" y="282.4" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#536C70">同一 tab · 同一挑战</text>
